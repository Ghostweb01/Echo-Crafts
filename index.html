<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EchoCraft — Spoken Practical Skills</title>
    <meta name="description" content="Offline-first spoken lessons in local languages for bookkeeping, sustainable farming, and digital basics with progress tracking and voice-to-text verification." />
    <meta property="og:title" content="EchoCraft — Spoken Practical Skills" />
    <meta property="og:description" content="Offline-first spoken lessons in local languages for bookkeeping, sustainable farming, and digital basics with progress tracking and voice-to-text verification." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#047857" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="EchoCraft" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="font-family:system-ui,-apple-system,sans-serif;max-width:520px;margin:48px auto;padding:24px;border:1px solid #d1d5db;border-radius:12px;color:#141a17;background:#ffffff;">
        <h1 style="margin:0 0 8px;font-size:18px;">JavaScript Required</h1>
        <p style="margin:0;font-size:14px;line-height:1.5;color:#425049;">EchoCraft requires JavaScript enabled to run spoken lessons and offline storage.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function () {
        var root = document.getElementById('root');
        if (!root) return;
        var shown = false;
        function showFallback(reason) {
          if (shown || root.childElementCount > 0) return;
          shown = true;
          var wrap = document.createElement('div');
          wrap.setAttribute('style', 'font-family:system-ui,-apple-system,sans-serif;max-width:560px;margin:48px auto;padding:24px;border:1px solid #e2e7e4;border-radius:16px;background:#ffffff;color:#141a17;box-shadow:0 4px 20px rgba(0,0,0,0.06);');
          var h = document.createElement('h1');
          h.setAttribute('style', 'margin:0 0 10px;font-size:18px;font-weight:700;');
          h.textContent = 'EchoCraft failed to start';
          var p1 = document.createElement('p');
          p1.setAttribute('style', 'margin:0 0 12px;font-size:14px;line-height:1.55;color:#425049;');
          p1.textContent = reason;
          var p2 = document.createElement('p');
          p2.setAttribute('style', 'margin:0;font-size:13px;line-height:1.55;color:#425049;background:#f7f8f7;padding:12px;border-radius:10px;border:1px solid #e2e7e4;');
          p2.textContent = 'If deploying on GitHub Pages: open your repository Settings -> Pages -> Build and deployment -> Source, select "GitHub Actions", and ensure the "Deploy EchoCraft to GitHub Pages" workflow succeeds.';
          wrap.appendChild(h);
          wrap.appendChild(p1);
          wrap.appendChild(p2);
          root.appendChild(wrap);
        }
        window.addEventListener('error', function (ev) {
          var target = ev && ev.target;
          if (target && target.tagName === 'SCRIPT') {
            var src = target.getAttribute('src') || 'app script';
            if (src.indexOf('/src/main.tsx') !== -1) {
              showFallback('GitHub Pages is serving the uncompiled repository files ("' + src + '" cannot run directly in the browser).');
            } else {
              showFallback('Failed to load application script: ' + src);
            }
          } else if (ev && ev.message) {
            showFallback('Startup error: ' + ev.message);
          }
        }, true);
        window.setTimeout(function () {
          if (root.childElementCount === 0) {
            showFallback('The application bundle did not mount in time. Check the browser console (F12) for network or script errors.');
          }
        }, 4000);
      })();
    </script>
  </body>
</html>
